name: OSS policy packaging validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oss-policy-smoke.yml
      - scripts/build_deb.sh
      - CMakeLists.txt
      - LICENSE
      - NOTICE
      - .runtime/NOTICE.txt

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libx11-dev libpng-dev python3 pkg-config dpkg-dev
      - name: Audit repository policy files
        run: |
          python3 scripts/audit_repository_layout.py
          test -f LICENSE
          test -f NOTICE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f .runtime/NOTICE.txt
      - name: Build Debian package
        run: ./scripts/build_deb.sh
      - name: Inspect Debian legal payload
        run: |
          set -euo pipefail
          DEB="dist/artifacts/such_1.0.0_amd64.deb"
          test -f "$DEB"
          rm -rf /tmp/such-deb-policy
          mkdir -p /tmp/such-deb-policy
          dpkg-deb -x "$DEB" /tmp/such-deb-policy
          test -f /tmp/such-deb-policy/usr/share/doc/such/LICENSE
          test -f /tmp/such-deb-policy/usr/share/doc/such/NOTICE
          test -f /tmp/such-deb-policy/usr/share/doc/such/runtime/HERITAGE_RUNTIME_NOTICE.txt
          python3 - <<'PY'
          from pathlib import Path
          license_text = Path('/tmp/such-deb-policy/usr/share/doc/such/LICENSE').read_text(encoding='utf-8', errors='replace')
          runtime_notice = Path('/tmp/such-deb-policy/usr/share/doc/such/runtime/HERITAGE_RUNTIME_NOTICE.txt').read_text(encoding='utf-8', errors='replace')
          assert 'Apache License' in license_text
          assert 'NOT licensed under the Apache License' in runtime_notice
          assert 'private Such SDK' in runtime_notice
          print('Debian legal payload PASS')
          PY
