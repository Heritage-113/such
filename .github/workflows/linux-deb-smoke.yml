name: Linux DEB smoke validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-deb-smoke.yml

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libx11-dev libpng-dev python3 pkg-config dpkg-dev
      - name: Verify executable modes
        run: |
          test -x scripts/build_linux.sh
          test -x scripts/verify_linux.sh
          test -x scripts/release_linux.sh
          test -x scripts/build_deb.sh
      - name: Build DEB
        run: ./scripts/build_deb.sh
      - name: Inspect and smoke package payload
        run: |
          set -euo pipefail
          test -f dist/artifacts/such_1.0.0_amd64.deb
          rm -rf /tmp/such-deb-root /tmp/such-state /tmp/such-corpus
          mkdir -p /tmp/such-deb-root /tmp/such-state /tmp/such-corpus
          dpkg-deb -x dist/artifacts/such_1.0.0_amd64.deb /tmp/such-deb-root
          test -x /tmp/such-deb-root/opt/such/bin/such
          test -x /tmp/such-deb-root/opt/such/bin/SuchCLI
          test -f /tmp/such-deb-root/opt/such/bin/libSuchRuntimePrivate.so
          printf 'deb smoke\n' > /tmp/such-corpus/SuchDebSmoke_47291.txt
          SUCH_STATE_DIR=/tmp/such-state /tmp/such-deb-root/opt/such/bin/SuchCLI "//drive /tmp/such-corpus" >/dev/null
          out="$(SUCH_STATE_DIR=/tmp/such-state /tmp/such-deb-root/opt/such/bin/SuchCLI SuchDebSmoke_47291)"
          printf '%s\n' "$out"
          grep -q 'SuchDebSmoke_47291.txt' <<<"$out"
