name: Policy package validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/policy-smoke.yml

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package manifest
        run: python3 scripts/audit_repository_layout.py
      - name: Validate policy documents
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s NOTICE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          grep -q 'Apache License' LICENSE
          grep -q 'Such SDK is private' README.md
          grep -q 'not licensed under Apache-2.0' docs/PUBLIC_BOUNDARY.md
