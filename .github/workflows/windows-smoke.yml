name: Windows build validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-smoke.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doctor
        shell: cmd
        run: scripts\doctor_windows.cmd
      - name: Build clean
        shell: cmd
        run: scripts\build_windows.cmd -Clean
      - name: Verify clean
        shell: cmd
        run: scripts\verify_windows.cmd -Clean
      - name: Release clean
        shell: cmd
        run: scripts\release_windows.cmd -Clean
