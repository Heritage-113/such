name: Apply Such v1.1.6 source bundle retry

on:
  push:
    branches:
      - automation/v1.1.4-public-refresh
    paths:
      - '.github/retry-v116'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source-bundle-*.b64 | base64 -d > /tmp/such-v1.1.6.tar.xz
          xz -t /tmp/such-v1.1.6.tar.xz
          tar -xJf /tmp/such-v1.1.6.tar.xz -C .

      - name: Normalize public runtime and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -f BUILD_VALIDATION_v1.0.0.md BUILD_VALIDATION_v1.0.0_Windows.md CODE_REVIEW_v1.0.0.md
          rm -f runtime/RUNTIME_SHA256_v1.0.0.txt
          mkdir -p .runtime/linux-x64
          cp .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly/libSuchRuntimePrivate.so .runtime/linux-x64/libSuchRuntimePrivate.so
          rm -rf .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly
          rm -f .github/source-bundle-*.b64 .github/source-bundle-ready .github/retry-v116
          rm -f .github/workflows/apply-v114-source.yml .github/workflows/apply-v116-retry.yml

      - name: Repository audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_repository_layout.py

      - name: Hermetic Linux release verification
        shell: bash
        run: |
          set -euo pipefail
          env -i \
            HOME=/tmp/such-host-home \
            PATH=/definitely/not/a/real/path \
            CC=/bin/false \
            CXX=/bin/false \
            CONFIG=Debug \
            BUILD_DIR=/tmp/redirected-build \
            INSTALL_DIR=/tmp/redirected-install \
            JOBS=1 \
            RUNTIME_LIBRARY_PATH=/tmp/not-the-runtime.so \
            CMAKE_TOOLCHAIN_FILE=/tmp/not-a-toolchain.cmake \
            /bin/bash -p scripts/build_linux.sh --clean --require-runtime
          ./build/linux-release/SuchCLI version | grep -Fx '1.1.6'

      - name: Rewrite staging branch as one clean release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Heritage Inc.'
          git config user.email 'jimin@heritage-labs.net'
          git add -A
          tree=$(git write-tree)
          parent=$(git rev-parse origin/main)
          commit=$(printf '%s\n\n%s\n' 'Release Such v1.1.6' 'Refresh public Such source, README, non-resident tooling, hermetic Linux build path, and Windows native search cue banner.' | git commit-tree "$tree" -p "$parent")
          git push --force origin "$commit:refs/heads/automation/v1.1.4-public-refresh"
