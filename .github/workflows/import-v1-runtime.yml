name: Import Such v1.0 runtime artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-v1-runtime.yml

permissions:
  contents: write

jobs:
  import-runtime:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download V1.0 release package
        run: |
          set -euo pipefail
          rm -rf /tmp/such-v1 /tmp/such-unpack
          mkdir -p /tmp/such-v1 /tmp/such-unpack
          gh release download 1.0 --repo "$GITHUB_REPOSITORY" --pattern 'such.v1.0.zip' --dir /tmp/such-v1
          echo '3ddc81e282d87a01c10a1b9372b95ca812ddd97598e818cf032ad9b00c3b3db0  /tmp/such-v1/such.v1.0.zip' | sha256sum -c -
          unzip -q /tmp/such-v1/such.v1.0.zip -d /tmp/such-unpack

      - name: Copy runtime artifacts
        run: |
          set -euo pipefail
          SRC_DIR="$(dirname "$(find /tmp/such-unpack -type f -name PACKAGE_MANIFEST.txt -print -quit)")"
          test -n "$SRC_DIR"
          test -f "$SRC_DIR/.runtime/windows-x64/SuchRuntimePrivate.dll"
          test -f "$SRC_DIR/.runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly/libSuchRuntimePrivate.so"
          rm -rf "$GITHUB_WORKSPACE/.runtime"
          cp -a "$SRC_DIR/.runtime" "$GITHUB_WORKSPACE/.runtime"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/import-v1-runtime.yml"

      - name: Commit runtime artifacts
        run: |
          set -euo pipefail
          git config user.name 'Heritage Inc.'
          git config user.email 'jimin@heritage-labs.net'
          git add -f .runtime
          git add -A .github/workflows/import-v1-runtime.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add Such v1.0 runtime artifacts'
          git push origin HEAD:main
