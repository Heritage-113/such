name: Apply Such v1.1.6 source

on:
  push:
    branches:
      - automation/v1.1.4-public-refresh
    paths:
      - '.github/source-bundle-*.b64'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source-bundle-*.b64 | base64 -d > /tmp/such-v1.1.6.tar.xz
          echo 'cf41157da7ccb2f94fd25d3f7ba38a542c435e0c31782feb133929e9d139fb10  /tmp/unused.tar.gz' >/dev/null
          rm -rf apps assets cmake docs font-bundles include platform runtime scripts src tests
          rm -f BUILD_VALIDATION_v*.md CODE_REVIEW_v*.md PACKAGE_MANIFEST.txt README.md CMakeLists.txt
          tar -xJf /tmp/such-v1.1.6.tar.xz -C .

          mkdir -p .runtime/linux-x64/licenses
          cp .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly/libSuchRuntimePrivate.so .runtime/linux-x64/libSuchRuntimePrivate.so
          cp .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly/LEGAL_NOTICE.txt .runtime/linux-x64/LEGAL_NOTICE.txt
          cp .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly/licenses/TopoDB-Apache-2.0-LICENSE.txt .runtime/linux-x64/licenses/TopoDB-Apache-2.0-LICENSE.txt
          cp .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly/licenses/TopoDB-NOTICE.txt .runtime/linux-x64/licenses/TopoDB-NOTICE.txt
          rm -rf .runtime/SuchRuntimePrivate_v0.6.2_Linux_x64_RuntimeOnly

          rm -f .github/source-bundle-*.b64
          rm -f .github/workflows/apply-v114-source.yml

      - name: Verify source and Linux build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_repository_layout.py
          env -i \
            HOME=/tmp/such-host-home \
            PATH=/definitely/not/a/real/path \
            CXX=/bin/false \
            CONFIG=Debug \
            BUILD_DIR=/tmp/redirected-build \
            INSTALL_DIR=/tmp/redirected-install \
            RUNTIME_LIBRARY_PATH=/tmp/not-the-runtime.so \
            /bin/bash -p scripts/build_linux.sh --clean --require-runtime

      - name: Publish one clean v1.1.6 commit on staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Heritage Inc.'
          git config user.email 'jimin@heritage-labs.net'
          git add -A
          tree_sha="$(git write-tree)"
          parent_sha="$(git rev-parse origin/main)"
          commit_sha="$(printf '%s\n\n%s\n' 'Release Such v1.1.6' 'Refresh the public source, keep Such non-resident, seal Linux build inputs, and use the native Windows cue banner.' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git push --force origin "$commit_sha:refs/heads/automation/v1.1.4-public-refresh"
